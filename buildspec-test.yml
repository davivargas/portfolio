# CodeBuild project: portfolio-test (pipeline Test stage).
# Lints, type-checks, and runs the Vitest suite. Produces no artifact.
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
  build:
    commands:
      - npm run lint
      - npx tsc --noEmit -p tsconfig.app.json
      - npm run test
